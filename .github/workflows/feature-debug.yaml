name: Feature debug build

on:
  push:
    branches:
      - feature/top-screen-only

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleGitHubProdDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: watermelon-ds-feature-debug
          path: app/build/outputs/apk/gitHubProd/debug/*.apk
          if-no-files-found: error
