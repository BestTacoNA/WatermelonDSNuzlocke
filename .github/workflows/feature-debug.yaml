name: Feature debug build

on:
  push:
    branches:
      - feature/top-screen-only

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'  

      - name: Build performance APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleGitHubProdPerformance

      - name: Upload performance APK
        uses: actions/upload-artifact@v4
        with:
          name: watermelon-ds-performance-test
          path: app/build/outputs/apk/gitHubProd/performance/*.apk
          if-no-files-found: error

    
